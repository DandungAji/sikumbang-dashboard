server {
    listen 80;
    server_name localhost;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Proxy ke Portainer API
    location /api/portainer/ {
        proxy_pass https://100.87.126.58:9443/api/endpoints/3/docker/containers/json?all=true;
        proxy_ssl_verify off;
        proxy_set_header X-API-Key "ptr_bch64b2M4xvJ8yt/Gmer3YNM+BqbFeF37SzHuuwHCpQ=";
    }

    # Proxy ke Python Stats API Realtime
    location /api/system-stats {
        proxy_pass http://127.0.0.1:5000/api/system-stats;
    }
}